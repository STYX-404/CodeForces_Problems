name: Track PR changes in slack
on:
  pull_request:
    types: [opened, closed, reopened, edited, labeled, unlabeled, assigned, unassigned]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  pull-requests: read
  contents: read
jobs:
  track:
    name: send to slack webhook
    runs-on: ubuntu-latest
    steps:
      - name: Get PR review status
        id: review_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=${{ github.event.pull_request.number }}
          repo=${{ github.repository }}
          reviews_json=$(gh api repos/$repo/pulls/$pr_number/reviews)
          latest_reviews=$(echo "$reviews_json" | jq '[group_by(.user.login)[] | sort_by(.submitted_at) | last]')
          review_status=$(echo "$latest_reviews" | jq -r '.[].state' | sort | uniq | tr '\n' ',' | sed 's/,$//')
          echo "REVIEW_STATUS=$review_status" >> $GITHUB_ENV
      - name: Prepare Slack Payload
        id: slack_payload
        env:
          LABELS_JSON: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          echo "LABELS_JSON: $LABELS_JSON"
          LABELS_JSON=$(echo "$LABELS_JSON" | jq -c .)
          pr_priority=$(echo "$LABELS_JSON" | tr ',' '\n' | grep -E '^P[1-4]$' | head -n1)
          pr_severity=$(echo "$LABELS_JSON" | tr ',' '\n' | grep -E '^S[1-4]$' | head -n1)
          repo_full="${{ github.repository }}"
          repo_name="${repo_full##*/}"
          pr_number="${{ github.event.pull_request.number }}"
          payload=$(jq -n \
            --arg pr_number "$pr_number" \
            --arg pr_title "${{ github.event.pull_request.title }}" \
            --arg pr_state "${{ github.event.pull_request.state }}" \
            --arg pr_author "${{ github.event.pull_request.user.login }}" \
            --arg pr_reviewers "${{ join(github.event.pull_request.requested_reviewers.*.login, ',') }}" \
            --arg pr_priority "$pr_priority" \
            --arg pr_severity "$pr_severity" \
            --arg repo "${{ github.repository }}" \
            --arg repo_name "$repo_name" \
            --arg review_status "$REVIEW_STATUS" \
            --arg pr_link "${{ github.event.pull_request.html_url }}" \
            '{
              pr_number: $pr_number,
              pr_title: $pr_title,
              pr_state: $pr_state,
              pr_author: $pr_author,
              pr_reviewers: $pr_reviewers,
              pr_priority: $pr_priority,
              pr_severity: $pr_severity,
              repo: $repo,
              repo_name: $repo_name,
              review_status: $review_status,
              pr_link: $pr_link
            }')
          echo "payload<<EOF" >> $GITHUB_ENV
          echo "$payload" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Create Slack List Record
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        run: |
          curl -X POST -H 'Content-type: application/json' --data "$payload" "${{ secrets.SLACK_CREATE_WEBHOOK_URL }}"
      - name: Update Slack List Record
        if: |
          github.event.action == 'edited' ||
          github.event.action == 'labeled' ||
          github.event.action == 'unlabeled' ||
          github.event.action == 'assigned' ||
          github.event.action == 'unassigned' ||
          github.event_name == 'pull_request_review'
        run: |
          curl -X POST -H 'Content-type: application/json' --data "$payload" "${{ secrets.SLACK_UPDATE_WEBHOOK_URL }}"
      - name: Delete Slack List Record
        if: github.event.action == 'closed' && (github.event.pull_request.merged == true || github.event.pull_request.merged == false)
        run: |
          curl -X POST -H 'Content-type: application/json' --data "$payload" "${{ secrets.SLACK_DELETE_WEBHOOK_URL }}"
